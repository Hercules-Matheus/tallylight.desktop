<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Tally Cloud Admin</title>

    <!-- CSP: scripts locais + unsafe-eval (requerido pelo PeerJS internamente)
         connect-src: Supabase (auth) + peerjs.com (sinalização WebRTC) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-eval';
               connect-src 'self'
                 https://0.peerjs.com wss://0.peerjs.com;
               style-src 'self' 'unsafe-inline';"
    />
  </head>
  <body>
    <div id="app">
      <section id="screen-setup" class="card" style="display: none">
        <h2>Configuração</h2>
        <form id="setup-form" onsubmit="event.preventDefault()">
          <div class="input-group">
            <input
              type="text"
              id="atem-ip"
              placeholder="IP do ATEM (ex: 192.168.1.50)"
              tabindex="1"
              required
            />
          </div>
          <button type="submit" id="btn-start" class="btn-primary" tabindex="3">
            INICIAR TRANSMISSÃO
          </button>
        </form>
      </section>

      <section id="screen-dash" class="card" style="display: none">
        <div class="status-bar">
          <span id="status-atem">ATEM: <b class="off">OFFLINE</b></span>
          <span id="status-cloud">CLOUD: <b class="on">ONLINE</b></span>
        </div>
        <div id="qr-container">
          <canvas id="qr-canvas"></canvas>
        </div>
        <div class="session-info">
          <p>CÓDIGO DA SESSÃO:</p>
          <h2 id="display-session">----</h2>
          <p
            id="sync-status"
            style="font-size: 0.8rem; opacity: 0.6; margin-top: 5px"
          >
            Aguardando câmeras...
          </p>
        </div>
        <button id="btn-stop" class="btn-primary">ENCERRAR SESSÃO</button>
      </section>
    </div>

    <!-- Scripts locais: evitam bloqueio CSP e funcionam offline no .exe -->
    <!-- Ordem obrigatória: qrcode → peerjs → PeerProvider → renderer     -->
    <script src="qrcode.min.js"></script>
    <script src="peerjs.min.js"></script>
    <script src="PeerProvider.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
